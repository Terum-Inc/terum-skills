name: Release announcement

# Announces each release: a post on Discord through a channel webhook (needs the DISCORD_WEBHOOK_URL
# secret) and the changelog on the website, committed to the Terum-Website repository as changelog.json
# (needs the SITE_REPO_TOKEN secret, a fine-grained token with Contents read/write on that repository
# only), which Vercel deploys as https://www.terum.ai/changelog. Both jobs read the same release notes
# (scripts/release-notes.mjs) and run independently, so one failing never holds back the other.
#
# Triggered by the Release workflow finishing, not by `release: published`: release.yml creates the tag
# and the GitHub Release with GITHUB_TOKEN, and events made with that token start no other workflow.
# A dry run of release.yml also finishes; it tags nothing, so the scripts find no release at the
# dispatched commit and do nothing. A recovery run finds its release already published before the
# run started and does nothing either; the website job also commits nothing when the file is unchanged.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g. v0.23.0). Empty means the latest release.'
        required: false
        type: string
      backfill:
        description: 'Website only: rebuild every release in changelog.json, not just this one.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  announce:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: node scripts/release-announcement.mjs ${TAG:+--tag "$TAG"} ${SHA:+--sha "$SHA"}

  website:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish changelog.json to the website repository
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          TAG: ${{ inputs.tag }}
          ALL: ${{ inputs.backfill == true && '1' || '' }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: node scripts/site-changelog.mjs ${TAG:+--tag "$TAG"} ${SHA:+--sha "$SHA"} ${ALL:+--all}
